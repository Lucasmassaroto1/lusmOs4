name: Publicar atualização

# Quando o número em lusmos/VERSION muda na branch main, o GitHub monta o
# pacote e publica a release v<versao>. O console baixa a release mais nova
# pelo Wi-Fi. (Também dá para rodar à mão em Actions › Run workflow.)
on:
  push:
    branches: [main]
    paths: ["lusmos/VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler a versão
        id: v
        run: echo "ver=$(tr -d '[:space:]' < lusmos/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Ver se essa versão já foi publicada
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.ver }}" >/dev/null 2>&1; then
            echo "Versão ${{ steps.v.outputs.ver }} já publicada, nada a fazer."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Montar o pacote
        if: steps.exists.outputs.skip != '1'
        run: tools/release.sh
      - name: Publicar a release
        if: steps.exists.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.v.outputs.ver }}
          NOTES=notas/$VER.md
          if [ -f "$NOTES" ]; then
            TITLE=$(head -n1 "$NOTES" | sed 's/^# *//')
            tail -n +2 "$NOTES" > /tmp/notas.md
          else
            TITLE="lusmOS $VER"; echo "lusmOS $VER" > /tmp/notas.md
          fi
          gh release create "v$VER" dist/lusmos-$VER.tar.gz dist/lusmos-$VER.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "$TITLE" --notes-file /tmp/notas.md
